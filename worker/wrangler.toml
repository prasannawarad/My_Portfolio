name = "portfolio-chatbot-api"
main = "src/index.js"
compatibility_date = "2024-12-01"

[vars]
ALLOWED_ORIGIN = "https://prasannawarad.com"

# Secrets — never in this file. Set with `wrangler secret put <NAME>`:
#   GEMINI_API_KEY  primary provider (Interactions API, gemini-3.6-flash)
#   GROQ_API_KEY    fallback provider (llama-3.3-70b-versatile), used when Gemini
#                   errors. Either key alone is enough to serve traffic; the request
#                   only fails when both are absent or failing.
#
# Gemini runs on the Interactions API (v1beta/interactions), not the retired
# generateContent endpoint — generateContent models are closed to new API keys.
# Override the model without a code change by adding to [vars]:
#   GEMINI_MODEL = "gemini-3.6-flash"
