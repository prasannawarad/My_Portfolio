name = "portfolio-chatbot-api"
main = "src/index.js"
compatibility_date = "2024-12-01"

[vars]
ALLOWED_ORIGIN = "https://prasannawarad.com"

# Secrets — never in this file. Set with `wrangler secret put <NAME>`:
#   GROQ_API_KEY    primary provider (llama-3.3-70b-versatile)
#   GEMINI_API_KEY  fallback provider, used when Groq errors or exhausts its free
#                   token quota. Optional: without it the chat still works, it just
#                   returns an honest cooldown message instead of falling through.
